name: apply-content-update
on:
  push:
    branches: [bundle-tmp]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bundle on a content-update branch
        run: |
          git fetch origin bundle-tmp
          if ! git cat-file -e origin/bundle-tmp:bundle.tar.gz 2>/dev/null; then echo "no bundle yet"; echo SKIP=1 >> $GITHUB_ENV; exit 0; fi
          git show origin/bundle-tmp:bundle.tar.gz > /tmp/bundle.tar.gz
          git config user.name "Omar Alawa"
          git config user.email "omarmohamed2591999@gmail.com"
          git checkout -b content-update
          tar xzf /tmp/bundle.tar.gz
          git add -A
          git commit -m "Update portfolio content to match CV and LinkedIn, new profile photo"
          git push origin content-update
      - name: Build
        if: env.SKIP != '1'
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build
          cp -r build /tmp/build
      - name: Deploy to gh-pages and fast-forward main
        if: env.SKIP != '1'
        run: |
          git checkout -- . 
          git clean -fdx -q
          git fetch origin gh-pages
          git checkout -b gh-pages origin/gh-pages
          git rm -rf -q .
          cp -r /tmp/build/. .
          touch .nojekyll
          git add -A
          git commit -m "Deploy updated portfolio build"
          git push origin gh-pages
          git checkout main
          git merge --ff-only content-update
          git push origin main
